name: test

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src/tuner
      # e2e needs a real audio device / display session — local-machine only
      - run: pytest -m "not e2e and not crosscheck"
      # timing gates skip themselves on parallel workers; run them serially
      - run: pytest -m perf -n0
