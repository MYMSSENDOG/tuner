[project]
name = "tuner"
version = "0.1.0"
description = "Cross-platform chromatic tuner"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "sounddevice>=0.5",
    "PySide6>=6.7",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=6.0", "pytest-xdist>=3.8", "ruff>=0.16", "mypy>=1.14"]
crosscheck = ["librosa>=0.11"]  # independent estimator for ground-truth validation

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -n auto: the suite is dominated by whole-recording integration runs, which
# are independent — 12 workers take it from >12min to ~90s on this machine.
addopts = "-q -m 'not crosscheck' -n auto"  # slow ground-truth audits are opt-in
markers = [
    "e2e: needs real hardware (audio device) or a real display; skips itself when unavailable",
    "crosscheck: slow full-bank validation against an independent estimator (opt in)",
    "perf: wall-clock timing gate; skips itself on parallel workers (pytest -m perf -n0)",
]

[tool.ruff]
# defaults + a couple of bug-catching extras; formatting is not enforced
[tool.ruff.lint]
extend-select = ["SIM", "BLE", "PLW", "RUF"]

[tool.mypy]
ignore_missing_imports = true  # PySide6/sounddevice ship incomplete stubs
